[profile.default]
solc_version = '0.8.28'
evm_version = 'cancun'
src = 'contracts'
out = 'out'
test = 'test/foundry'
cache_path = 'cache/foundry'
verbosity = 3
optimizer = true
# same as hardhat.config.ts, so measured gas matches the deployed bytecode
optimizer_runs = 200
# the payload fixtures of docs/evaluation/PROTOCOL.md, read by the storage baseline (DS5)
fs_permissions = [{ access = "read", path = "./fixtures" }]

libs = [
    # We provide a set of useful contract utilities
    # in the lib directory of @layerzerolabs/toolbox-foundry:
    # 
    # - forge-std
    # - ds-test
    # - solidity-bytes-utils
    'node_modules/@layerzerolabs/toolbox-foundry/lib',
    'node_modules',
]

remappings = [
    # Due to a misconfiguration of solidity-bytes-utils, an outdated version
    # of forge-std is being dragged in
    # 
    # To remedy this, we'll remap the ds-test and forge-std imports to our own versions
    'ds-test/=node_modules/@layerzerolabs/toolbox-foundry/lib/ds-test',
    'forge-std/=node_modules/@layerzerolabs/toolbox-foundry/lib/forge-std',
    '@layerzerolabs/=node_modules/@layerzerolabs/',
    '@openzeppelin/=node_modules/@openzeppelin/',
]

[fuzz]
runs = 1000

# DS5, the storage baseline (test/foundry/StorageBaseline.t.sol): every external call is its own transaction, so that
# storage is cold as in a real transaction, and the test may write its raw result next to the other reports.
#   FOUNDRY_PROFILE=ds5 forge test --match-contract StorageBaseline        (checks only)
#   npx hardhat e2e:storage                                                 (also writes e2e_reports/storage-baseline.*)
[profile.ds5]
isolate = true
fs_permissions = [
    { access = "read", path = "./fixtures" },
    { access = "read-write", path = "./e2e_reports" },
]
